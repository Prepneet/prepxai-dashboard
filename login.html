<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Log in · PrepX AI</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://artcffpfotgrmbhtrtsb.supabase.co wss://artcffpfotgrmbhtrtsb.supabase.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none';">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%238b5cf6'/%3E%3Cpath d='M12 5l7 3.5-7 3.5-7-3.5z' fill='white'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;color:#fff;background:#0b1238;overflow-x:hidden;position:relative}
h1,h2,.logo{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.8;z-index:0;animation:drift 16s ease-in-out infinite;pointer-events:none}
.b1{width:340px;height:340px;background:#2d5be3;top:-110px;left:-90px}
.b2{width:280px;height:280px;background:#ffa94d;bottom:-70px;right:-70px;animation-delay:-6s;opacity:.5}
.b3{width:240px;height:240px;background:#7c5cff;top:50%;left:60%;animation-delay:-10s;opacity:.45}
.card{position:relative;z-index:2;width:100%;max-width:900px;display:grid;grid-template-columns:1fr 1fr;border-radius:28px;overflow:hidden;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);box-shadow:0 30px 80px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.45);animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0) 40%)}
.left{position:relative;padding:44px 36px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(160deg,rgba(45,91,227,.55),rgba(13,26,92,.35));border-right:1px solid rgba(255,255,255,.2)}
.left .logo{position:absolute;top:30px;left:36px;font-weight:800;font-size:22px}
.left .o{color:#ffb86b}
.left h1{font-size:40px;line-height:1.1;margin-bottom:14px}
.left p{color:rgba(255,255,255,.82);font-size:15px;line-height:1.6;max-width:320px}
.right{position:relative;padding:44px 40px}
.ttl{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.ttl i{width:34px;height:4px;border-radius:9px;background:linear-gradient(90deg,#ffb86b,#5b7cff)}
.ttl h2{font-size:24px}
.gbtn{width:100%;padding:13px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;font:600 14px Inter;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.gbtn:hover{background:rgba(255,255,255,.24)}
.gbtn svg{width:18px;height:18px}
.or{text-align:center;color:rgba(255,255,255,.6);font-size:12px;font-weight:600;margin:18px 0 4px;letter-spacing:.06em}
label{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,.9);margin:14px 0 6px}
.in{position:relative}
input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.28);font:15px Inter;color:#fff;background:rgba(255,255,255,.1);outline:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
input::placeholder{color:rgba(255,255,255,.5)}
input:focus{border-color:rgba(255,255,255,.7);box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.in input{padding-right:46px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;padding:8px;color:rgba(255,255,255,.8);font-size:16px}
.submit{width:100%;margin-top:22px;padding:14px;border:0;border-radius:14px;background:linear-gradient(120deg,#2d5be3,#5b7cff);color:#fff;font:600 16px Sora;cursor:pointer;box-shadow:0 14px 30px -10px rgba(45,91,227,.9),inset 0 1px 0 rgba(255,255,255,.4)}
.submit:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;font-size:13.5px;margin-top:12px;text-align:center}
.err{color:#ffb3c6}.ok{color:#9dffc4}
.links{display:flex;justify-content:space-between;gap:12px;margin-top:18px;font-size:13.5px;flex-wrap:wrap;color:rgba(255,255,255,.75)}
.links button,.links a{background:none;border:0;color:#fff;font:600 13.5px Inter;cursor:pointer;text-decoration:none;padding:0;border-bottom:1px solid rgba(255,255,255,.4)}
.links .su{color:#ffb86b;border-bottom-color:rgba(255,184,107,.6)}
@media(max-width:760px){
  .card{grid-template-columns:1fr;max-width:460px}
  .left{padding:30px 24px 26px;min-height:200px;border-right:0;border-bottom:1px solid rgba(255,255,255,.2)}
  .left .logo{top:20px;left:24px}
  .left h1{font-size:28px;margin-top:40px}
  .right{padding:30px 24px}
}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.08)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.brand{display:inline-flex;align-items:baseline;font-family:Sora,Inter,system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1;color:inherit;white-space:nowrap}
.brand .bx{display:inline-block;width:.9em;height:.9em;margin:0 .05em 0 .03em;vertical-align:-.02em}
.brand .xs{width:100%;height:100%;overflow:visible;display:block}
.brand .ba{margin-left:.34em;background:linear-gradient(135deg,var(--a,#8b5cf6),var(--b,#22d3ee));-webkit-background-clip:text;background-clip:text;color:transparent}
@media(max-width:760px){.top{background:#0c1236!important}}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:rgba(255,255,255,.82);margin-top:14px;line-height:1.5}
.consent a{color:#fff}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="card" role="main">
  <section class="left" aria-label="Welcome">
    <a class="logo" href="https://prepxai.online/" aria-label="PrepX AI home" style="text-decoration:none;color:#fff"><span class="brand"><span class="bp">Prep</span><span class="bx"><svg class="xs" viewBox="0 0 56 56" aria-hidden="true"><defs><linearGradient id="pxg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><g stroke="url(#pxg)" stroke-width="7" stroke-linecap="round" fill="none"><path d="M9 9 L47 47"/><path d="M47 9 L9 47"/><path d="M44 12 L58 -2" stroke-width="4.5"/></g></svg></span><span class="ba">Ai</span></span></a>
    <h1>Welcome<br>Back.</h1>
    <p>Your journey to a higher score starts here. Log in to continue your plan with AI-powered guidance.</p>
  </section>

  <section class="right">
    <div class="ttl"><i></i><h2 id="title">Log in</h2></div>

    <button class="gbtn" id="gbtn" type="button">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.7-4.2-13.6-9.9l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Use Google Account
    </button>

    <div class="or">OR</div>

    <form id="lf" novalidate>
      <label for="em">Email</label>
      <input id="em" type="email" autocomplete="email" placeholder="Enter your email here..." required>

      <label for="pw">Password</label>
      <div class="in">
        <input id="pw" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        <button type="button" class="eye" id="eye" aria-label="Show password">👁</button>
      </div>

      <label id="consentRow" class="consent" hidden><input type="checkbox" id="consent"> I am 18 or older, or my parent or guardian has agreed to this account. I have read the <a href="https://prepxai.online/legal/privacy.html" target="_blank" rel="noopener">privacy policy</a>.</label>
  <button class="submit" id="sb" type="submit">Log in</button>
      <p class="msg" id="msg" role="status"></p>
    </form>

    <div class="links">
      <button type="button" id="fp">Forgot password?</button>
      <button type="button" id="su">Create account</button>
    </div>
  </section>
</div>

<script>
(function(){
'use strict';
var SB_URL='https://artcffpfotgrmbhtrtsb.supabase.co',SB_KEY='sb_publishable_YXu_zr1Bk2GBr7H3PGTfQQ_vqVwT2BB';
var DASH_HOME=location.origin+location.pathname.replace(/login\.html$/,'')+'index.html';
var ER=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
var $=function(i){return document.getElementById(i)};
var recovering=/type=recovery/.test(location.hash);
var sb=null;try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}

function msg(t,k){var m=$('msg');m.textContent=t;m.className='msg '+(k||'')}
function busy(on){$('sb').disabled=on;$('sb').textContent=on?'Please wait…':($('sb').dataset.label||'Log in')}

if(recovering){
  $('title').textContent='Set new password';
  $('pw').setAttribute('autocomplete','new-password');
  $('pw').placeholder='Enter a new password (8+ characters)';
  $('sb').textContent='Save new password';
  msg('Reset link verified. Choose a new password.','ok');
}
(async function(){
  if(!sb||recovering)return;
  try{var r=await sb.auth.getSession();if(r.data&&r.data.session)location.replace(DASH_HOME)}catch(e){}
})();

function readDraft(){var m=document.cookie.match(/(?:^|; )prepx_draft=([^;]*)/);if(!m)return null;try{return JSON.parse(decodeURIComponent(m[1]))}catch(e){return null}}
var signupMode=false;
function setMode(s){
  signupMode=s;
  $('title').textContent=s?'Create account':'Log in';
  $('sb').dataset.label=s?'Create account':'Log in';
  $('sb').textContent=s?'Create account':'Log in';
  $('pw').setAttribute('autocomplete',s?'new-password':'current-password');
  $('su').textContent=s?'Back to log in':'Create account';
  msg(s?'Set a password to save your plan.':'','ok');
  $('consentRow').hidden=!s;
}
$('su').onclick=function(){setMode(!signupMode)};
if(!recovering&&/mode=signup/.test(location.search)&&readDraft())setMode(true);
$('eye').onclick=function(){var i=$('pw');i.type=i.type==='password'?'text':'password'};

$('lf').onsubmit=async function(e){
  e.preventDefault();
  if(!sb)return msg('Service did not load. Refresh the page.','err');
  var em=$('em').value.trim().toLowerCase(),pw=$('pw').value;
  if(recovering){
    if(pw.length<8)return msg('Password must be at least 8 characters.','err');
    busy(true);msg('');
    var u=await sb.auth.updateUser({password:pw});
    if(u.error){busy(false);return msg(u.error.message,'err')}
    msg('Password updated. Opening your dashboard…','ok');
    location.replace(DASH_HOME);return;
  }
  if(!ER.test(em))return msg('Please enter a valid email.','err');
  if(!pw)return msg('Please enter your password.','err');
  if(signupMode){
    if(pw.length<8)return msg('Password must be at least 8 characters.','err');
    if(!$('consent').checked)return msg('Please confirm your age or parental consent to continue.','err');
    var d=readDraft()||{};
    busy(true);msg('');
    var su=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:DASH_HOME,data:{
      target_exam:d.e||'',exam_date:d.d||'',student_status:d.st||'',stage:d.sg||'',
      weakness:(d.w||[]).join(', '),daily_hours:String(d.h||''),language:d.lang||'en'}}});
    if(su.error){busy(false);return msg(su.error.message,'err')}
    if(su.data&&su.data.user&&su.data.user.identities&&su.data.user.identities.length===0){busy(false);return msg('This email is already registered. Please log in.','err')}
    document.cookie='prepx_draft=; domain=.prepxai.online; path=/; max-age=0; secure; samesite=lax';
    busy(false);
    setMode(false);
    msg('Account created. Check your email to confirm, then log in.','ok');
    return;
  }
  busy(true);msg('');
  var r=await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error){
    var t=r.error.message||'';
    msg(/confirm/i.test(t)?'Please confirm your email first. Check your inbox.':'Incorrect email or password.','err');
    busy(false);return;
  }
  msg('Logged in. Opening your dashboard…','ok');
  location.replace(DASH_HOME);
};

$('gbtn').onclick=async function(){
  if(!sb)return msg('Service did not load. Refresh the page.','err');
  var r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:DASH_HOME}});
  if(r.error)msg(r.error.message,'err');
};

$('fp').onclick=async function(){
  var em=$('em').value.trim().toLowerCase();
  if(!ER.test(em))return msg('Enter your email above first, then tap Forgot password.','err');
  var r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  msg(r.error?r.error.message:'Reset link sent to your email.',r.error?'err':'ok');
};
})();
</script>
</body>
</html>
